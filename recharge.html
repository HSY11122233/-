{% extends "base.html" %}
{% block title %}余额充值{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">💰 余额充值</h2>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">当前余额：¥{{ "%.2f"|format(balance) }}</h5>
        </div>
        <div class="card-body">
            <p class="text-muted">余额可用于支付逾期罚款，充值即到账。</p>

            <form method="POST" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="amount" class="form-label">充值金额（元）</label>
                    <input type="number" name="amount" id="amount" class="form-control form-control-lg" 
                           step="0.01" min="0.01" placeholder="如 50.00" required autofocus>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-success btn-lg px-5">立即充值</button>
                </div>
            </form>

            <div class="mt-4">
                <div class="row row-cols-2 row-cols-md-4 g-3">
                    <div class="col"><button type="button" class="btn btn-outline-primary w-100" onclick="document.getElementById('amount').value=10">¥10</button></div>
                    <div class="col"><button type="button" class="btn btn-outline-primary w-100" onclick="document.getElementById('amount').value=20">¥20</button></div>
                    <div class="col"><button type="button" class="btn btn-outline-primary w-100" onclick="document.getElementById('amount').value=50">¥50</button></div>
                    <div class="col"><button type="button" class="btn btn-outline-primary w-100" onclick="document.getElementById('amount').value=100">¥100</button></div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">返回个人中心</a>
    </div>
</div>
{% endblock %}
