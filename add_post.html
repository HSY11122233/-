{% extends "base.html" %}
{% block title %}发表新帖 - 智慧图书馆论坛{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-7">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="mb-0"><i class="fas fa-edit fa-lg me-3"></i>发表新帖</h3>
                </div>
                <div class="card-body p-5">
                    <form action="{{ url_for('add_post') }}" method="POST">
                        <div class="mb-4">
                            <textarea class="form-control rounded-4 shadow-sm" 
                                      name="content" 
                                      rows="12" 
                                      placeholder="分享你的想法、提问、资源、心得……支持换行和表情哦～"
                                      required 
                                      maxlength="1000"
                                      style="resize: vertical;">{{ request.form.content if request.form else '' }}</textarea>
                            <div class="text-end text-muted mt-2">
                                <small>已输入 <span id="count">0</span>/1000 字</small>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('forum') }}" class="btn btn-outline-secondary rounded-pill px-4">
                                <i class="fas fa-arrow-left me-2"></i>返回论坛
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-lg">
                                <i class="fas fa-paper-plane me-2"></i>发布帖子
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelector('textarea').addEventListener('input', function() {
    document.getElementById('count').textContent = this.value.length;
});
</script>
{% endblock %}
